# GENERATED by sisu — do not edit; customize via overrides/ and re-emit.
# The required status check for protected branches is the job named
# "sisu / verdict". It runs under always() and never skips, so a skipped
# upstream job can never be mistaken for a satisfied required check.
name: sisu gates

on:
  pull_request:
    branches: ["main"]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sisu-gates-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  change-scan:
    name: "sisu / change scan"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 2
      - name: Secret scan (always-on copy)
        run: |
          GL=8.18.4
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GL}/gitleaks_${GL}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks detect --no-git --redact --no-banner --exit-code 1
      - name: Classify diff (docs-only? fail-safe toward running)
        id: classify
        run: |
          set -euo pipefail
          DOCS_ONLY=false
          FILES=""
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            if FILES=$(git diff --name-only HEAD^1 HEAD) && [[ -n "$FILES" ]]; then
              DOCS_ONLY=true
              while IFS= read -r f; do
                case "$f" in
                  # governance is never docs — checked BEFORE the docs allowlist
                  CLAUDE.md|*/CLAUDE.md|AGENTS.md|.claude/*|harness/*|sisu.yaml|sisu.lock.json|.github/*|overrides/*|project/quality-baselines.json|project/waivers/*|project/roles/*|.gitleaks.toml|package-lock.json|*/package-lock.json)
                    DOCS_ONLY=false; break ;;
                  docs/*|*.md) ;;
                  *) DOCS_ONLY=false; break ;;
                esac
              done <<< "$FILES"
            fi
          fi
          echo "docs_only=$DOCS_ONLY" >> "$GITHUB_OUTPUT"
          echo "docs_only=$DOCS_ONLY"

  gates:
    name: "sisu / gates"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [change-scan]
    # Skips ONLY on a proven docs-only diff. A failed/errored scan un-skips.
    if: ${{ always() && (needs.change-scan.result != 'success' || needs.change-scan.outputs.docs_only != 'true') }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 20
      - name: Install (node)
        run: npm ci
      - name: Secret scan (required-check copy)
        run: |
          GL=8.18.4
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GL}/gitleaks_${GL}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks detect --no-git --redact --no-banner --exit-code 1
      - name: Harness self-verification (roles load, refs resolve, dispatch complete, hooks behave)
        run: node --test "harness/tests/*.test.mjs"
      - name: Knowledge index within budget and active facts meet the promotion bar
        run: node harness/scripts/index.mjs --check
      - name: "Oracle node.test — Unit tests"
        run: npm test
      - name: "Oracle node.typecheck — Type check"
        run: npx tsc --noEmit
      - name: "Oracle node.audit — Dependency audit (high+)"
        run: npm audit --audit-level high

  verdict:
    name: "sisu / verdict"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [change-scan, gates]
    # always(): a failed upstream job must produce a RED required check, never a skipped one.
    if: ${{ always() }}
    steps:
      - name: Verdict (red unless gates succeeded, or were skipped by a PROVEN docs-only diff)
        env:
          SCAN_RESULT: ${{ needs.change-scan.result }}
          GATES_RESULT: ${{ needs.gates.result }}
          DOCS_ONLY: ${{ needs.change-scan.outputs.docs_only }}
        run: |
          echo "scan=$SCAN_RESULT gates=$GATES_RESULT docs_only=$DOCS_ONLY"
          if [ "$GATES_RESULT" = "success" ]; then exit 0; fi
          if [ "$GATES_RESULT" = "skipped" ] && [ "$SCAN_RESULT" = "success" ] && [ "$DOCS_ONLY" = "true" ]; then
            echo "docs-only diff: heavy gates skipped by design (skipped counts as satisfied HERE ONLY)"; exit 0
          fi
          echo "::error::gates result: $GATES_RESULT (scan: $SCAN_RESULT)"; exit 1
